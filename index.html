  const lista = (sel) => [...document.querySelectorAll('#tel ' + sel)].slice(0, 1);
  function empieza() {
    if (tour) return;
    tour = { i: 0, caja: { st: { ...st }, T, HOY, vanTodos } };
    st.practicando = true; st.hoja = null; st.toast = null; st.escribe = null; st.ins = null; st.yds = 'si'; st.mkVer = 'marcar'; clearTimeout(tToast);
    // un celular sin jugadores practica con tres de mentira (solo en esta copia de la temporada)
    if (!PLANTEL.length) { T = { ...T, plantel: [1, 2, 3].map((n) => ({ id: 'practica' + n, nombre: 'Jugador ' + n, n })) }; recalcular(); }
    if (!st.van.length) st.van = PLANTEL.map((x) => x.id);
    if (!esRival(HOY)) HOY = RIVALES[0].id;
    nuevoPartido(); st.partido.practica = true;
    entra();
  }
  // al llegar a un paso: su pantalla, y lo que se resalta a la vista
  function entra() {
    const p = PASOS[tour.i];
    if (p.pant && st.pant !== p.pant) { st.pant = p.pant; st.hoja = null; }
    pintar();
    const el = p.sel && lista(p.sel)[0], c = el && el.closest('.cuerpo');
    if (c) { const r = el.getBoundingClientRect(), rc = c.getBoundingClientRect(); if (r.top < rc.top + 60 || r.bottom > rc.bottom - 150) c.scrollTop += r.top - rc.top - Math.max(80, (rc.bottom - rc.top) * .3); }
    if (document.querySelector('#tel .hoja')) setTimeout(pinta, 260); // la hoja sube en .2 s: se mide ya quieta
  }
  function fin() {
    if (!tour) return;
    const c = tour.caja; tour = null;
    lsSet('belugas.visto.ver', '1');
    T = c.T; HOY = c.HOY; vanTodos = c.vanTodos;
    for (const k in st) if (!(k in c.st)) delete st[k]; // lo que la práctica agregó (en qué vista iba Marcar, la jugada escogida)
    Object.assign(st, c.st, { hoja: null, toast: null, cuanto: null, practicando: false }); clearTimeout(tToast);
    recalcular(); if (st.partido) rehacer(st.partido);
    pinta(); pintar();
    sinc(filas.vivo); sinc(filas.temp); // lo que llegó de la nube mientras tanto
  }
  function sigue() { if (!tour) return; if (tour.i >= PASOS.length - 1) return fin(); tour.i++; entra(); }
  function rect(p, tel) {
    const els = lista(p.sel); if (!els.length) return null;
    const r = els[0].getBoundingClientRect(), pad = 6, rad = parseFloat(getComputedStyle(els[0]).borderTopLeftRadius) || 12;
    const l = r.left - tel.left - pad, tp = Math.max(r.top - tel.top - pad, 4), b = Math.min(r.bottom - tel.top + pad, tel.height - 4);
    return { l, t: tp, w: r.width + 2 * pad, h: Math.max(b - tp, 24), rad: rad + pad };
  }
  function pinta() {
    if (!tour) { ov.className = 'onb'; ov.innerHTML = ovHtml = ''; return; }
    const tel = document.querySelector('#tel').getBoundingClientRect(), p = PASOS[tour.i];
    ov.style.cssText = `left:${tel.left}px;top:${tel.top}px;width:${tel.width}px;height:${tel.height}px;border-radius:${getComputedStyle(document.querySelector('#tel')).borderRadius}`;
    ov.className = 'onb on' + (p.hecho ? ' practica' : '');
    const r = p.sel ? rect(p, tel) : null, n = PASOS.length, ultimo = tour.i === n - 1;
    const cuenta = `<div class="onb-n">Paso ${tour.i + 1} de ${n}<span class="puntos">${PASOS.map((_, i) => `<i class="${i === tour.i ? 'on' : ''}"></i>`).join('')}</span></div>`;
    const acc = `<div class="onb-acc">${ultimo ? '' : '<button class="saltar" data-o="fin">Saltar</button>'}${p.hecho ? '' : `<button class="sig" data-o="sig">${p.boton || 'Siguiente'}</button>`}</div>`;
    let pos = 'centro', estilo = 'top:50%;transform:translateY(-50%)', ax = 50;
    if (r) { const cy = r.t + r.h / 2; ax = Math.min(88, Math.max(12, ((r.l + r.w / 2) - 16) / (tel.width - 32) * 100));
      if (cy > tel.height * .52 || r.t + r.h + 190 > tel.height) { pos = 'arriba'; estilo = `bottom:${tel.height - r.t + 14}px`; } else { pos = 'abajo'; estilo = `top:${r.t + r.h + 14}px`; } }
    // en los pasos de tocar solo se puede tocar el hueco
    const tapas = r && p.hecho ? [`left:0;top:0;right:0;height:${r.t}px`, `left:0;top:${r.t + r.h}px;right:0;bottom:0`, `left:0;top:${r.t}px;width:${r.l}px;height:${r.h}px`, `left:${r.l + r.w}px;top:${r.t}px;right:0;height:${r.h}px`].map((s) => `<div class="onb-tapa" style="${s}"></div>`).join('') : '';
    const html = (r ? `<div class="onb-hueco" style="left:${r.l}px;top:${r.t}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}px"></div>` : '<div class="onb-velo"></div>') + tapas
      + `<div class="onb-card ${pos}" style="${estilo};--ax:${ax}%">${cuenta}<b>${p.tit}</b><p>${p.txt}</p>${acc}</div>`;
    // si nada cambió no se rehace: la tarjeta no vuelve a aparecer ni el pulso empieza de nuevo cada vez que la app se pinta
    if (html !== ovHtml) ov.innerHTML = ovHtml = html;
  }
  ov.addEventListener('click', (e) => {
    const b = e.target.closest('[data-o]');
    if (b) { e.stopPropagation(); ({ sig: sigue, fin }[b.dataset.o])(); return; }
    if (tour && !PASOS[tour.i].hecho && !e.target.closest('.onb-card')) sigue(); // tocar fuera de la tarjeta = siguiente
  });
  document.addEventListener('keydown', (e) => { if (tour && e.key === 'Escape') fin(); });
  addEventListener('resize', () => pinta());
  // después de cada pintada: el paso de tocar avanza solo en cuanto se hizo
  onbTras = () => {
    if (!tour) return;
    const p = PASOS[tour.i];
    if (p.hecho && st.partido && p.hecho()) return sigue();
    requestAnimationFrame(pinta);
  };
  A.ayuda = () => { st.hoja = 'ayuda'; };
  A.tour = () => empieza();
  window.onb = { empieza, fin, sigue, get T() { return tour; }, get paso() { return tour && PASOS[tour.i]; } };
  if (!visto()) setTimeout(() => { if (st.pant === 'inicio' && !st.hoja) empieza(); }, 1300);
})();
// ---------- al abrir: lo guardado en el teléfono primero (sirve sin señal), luego la nube ----------
cargaLocal(); recalcular(); if (st.partido) rehacer(st.partido); cierraViejo();
pintar();
sinc(filas.temp); sinc(filas.vivo); revisarVersion(); leeLibro();
// pedir al navegador que no borre los datos de la app
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* no hay */ }
// abrir sin señal (solo en la dirección publicada; en la Mac no, para ver los cambios al momento)
if (!PRUEBA && location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// la de prueba sin llave: sin los partidos de antes (la temporada de ejemplo ya los trae con jugadas) y, si el aparato no tiene nada, con el plantel, los 8 partidos y el
// libro de jugadas de pruebas/partidos.mjs; todo queda solo en este aparato
if (PRUEBA && !clave) import('./pruebas/partidos.mjs').then((m) => { const pon = () => { if (st.practicando) return setTimeout(pon, 1000);
  LIBRO = m.LIBRO; PASADOS.length = 0; Object.keys(ANTES).forEach((k) => { delete ANTES[k]; });
  if (!T.plantel.length) { T.plantel = m.NOMBRES.map((n, i) => ({ id: m.IDS[i], nombre: n, n: i, ver: 1 })); T.linea = { O: [], D: [], qb: 'mau', ver: 1 }; T.juegos = Object.fromEntries(m.juegosNuevos.map((g) => [g.id, g])); }
  recalcular(); pintar(); }; pon(); }).catch((e) => console.error('ejemplo', e));
</script>
